<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!--
  claude-artifact-publish 읽기용 페이지 셸. 이 파일 뒤에 본문 HTML을 이어 붙여 단일 HTML로 발행한다.
  </body></html>은 HTML 명세상 생략할 수 있다. 외부 폰트·CDN 없이 시스템 글꼴만 쓴다.
-->
<style>
:root {
  color-scheme: light dark;
  --paper: #fbfaf7;
  --paper-2: #f3f1ec;
  --ink: #23221f;
  --muted: #6b6760;
  --rule: #e6e2d9;
  --accent: #a8461f;
  --lift: 0 1px 2px rgb(0 0 0 / .06), 0 6px 16px rgb(0 0 0 / .08);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #1b1a18; --paper-2: #252421; --ink: #e9e7e2; --muted: #a7a29a; --rule: #35332f; --accent: #ee9b74; --lift: 0 1px 2px rgb(0 0 0 / .4), 0 6px 16px rgb(0 0 0 / .45); }
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  max-width: 48rem;
  margin: 0 auto;
  padding: clamp(2rem, 7vw, 4.5rem) clamp(1.25rem, 5vw, 2.5rem) 6rem;
  color: var(--ink);
  font: 1rem/1.75 var(--sans);
  letter-spacing: -0.003em;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
@media (min-width: 40rem) { body { font-size: 1.0625rem; } }

h1, h2, h3, h4, h5, h6 { margin: 0; font-weight: 700; line-height: 1.35; letter-spacing: -0.02em; text-wrap: balance; scroll-margin-top: 1.5rem; }
h1 { font-size: 1.9em; margin-bottom: .75em; }
h2 { font-size: 1.4em; margin: 2.6em 0 .8em; padding-top: 1.1em; border-top: 1px solid var(--rule); }
h3 { font-size: 1.15em; margin: 2em 0 .6em; }
h4 { font-size: 1em; margin: 1.6em 0 .4em; }
h5, h6 { font-size: .9em; margin: 1.4em 0 .4em; color: var(--muted); }

p, ul, ol, dl, blockquote, pre { margin: 0 0 1.15em; }
ul, ol { padding-left: 1.5em; }
li { margin: .3em 0; }
li > ul, li > ol { margin: .3em 0 0; }
li::marker { color: var(--muted); }
ul:has(> li > input[type="checkbox"]) { padding-left: .2em; list-style: none; }
li > input[type="checkbox"] { margin: 0 .55em 0 0; vertical-align: -.1em; accent-color: var(--accent); }
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
hr { margin: 2.5em 0; border: 0; border-top: 1px solid var(--rule); }
img { max-width: 100%; height: auto; border-radius: 8px; }
blockquote { padding: .1em 0 .1em 1em; border-left: 3px solid var(--accent); color: var(--muted); }
blockquote > :last-child { margin-bottom: 0; }

code, kbd, pre { font-family: var(--mono); font-size: .875em; }
pre code { font-size: 1em; }
:not(pre) > code { padding: .1em .35em; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 5px; }
pre { padding: 1em 1.15em; overflow-x: auto; line-height: 1.6; tab-size: 2; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 10px; }

/* 핵심 수치 카드: 긴 문서 첫머리에서 원문 수치를 요약한다. SKILL.md "긴 문서는 인포그래픽으로" 참고.
   diagram-design 요약 카드처럼 같은 폭 반복을 피한다. 첫 카드가 대표 수치로 더 넓고, 강조색은 그 숫자 하나에만 쓴다. */
.stats { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.5em 0 2em; }
.stats > div { flex: 1 1 9rem; padding: .85em 1em; border: 1px solid var(--rule); border-radius: 8px; }
.stats > div:first-child { flex-grow: 2.5; }
.stats > div:first-child b { color: var(--accent); }
.stats b { display: block; font-size: 1.7em; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stats span { display: block; margin-top: .35em; color: var(--muted); font-size: .85em; line-height: 1.45; text-wrap: pretty; }

/* 넓은 표는 페이지가 아니라 표만 가로로 스크롤한다. 래퍼는 아래 스크립트가 씌우고,
   본문 폭을 넘는 표는 .wide로 그림처럼 본문 밖(--w)까지 넓힌다. */
.table-wrap { margin: 0 0 1.4em; overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
.table-wrap.wide { --w: 60rem; margin-inline: min(0px, (100% - min(var(--w), 100vw - 2.5rem)) / 2); }
body > table { display: block; margin: 0 0 1.4em; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9em; line-height: 1.55; font-variant-numeric: tabular-nums; }
th, td { min-width: 5.5em; padding: .6em .85em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
th { font-weight: 600; white-space: nowrap; background: var(--paper-2); }
@media (max-width: 40rem) { th, td { min-width: 8.5em; } }
tbody tr:last-child > * { border-bottom: 0; }
[align="right"] { text-align: right; }
[align="center"] { text-align: center; }

/* diagram-design 그림. 스킨(ai-publish 프로필)이 이 페이지 토큰과 같아 라이트에서는 본문 종이 위에 그대로 놓인다.
   `-dark.svg` 짝이 있으면 다크 모드에서 그것으로 바꾸고, 없으면 밝은 그림이 둥근 카드로 남는다.
   SVG는 viewBox 너비(--w) 아래로 줄지 않는다(글자 크기 보존). 넓은 화면에서는 본문 폭 밖으로 넓히고,
   좁은 화면에서는 그림만 가로로 스크롤한다. */
figure { margin: 2em 0; }
figcaption { margin-top: .6em; color: var(--muted); font-size: .875em; text-align: center; }
.diagram { --w: 960px; margin-inline: min(0px, (100% - min(var(--w), 100vw - 2.5rem)) / 2); }
.diagram-container { overflow-x: auto; border-radius: 10px; }
.diagram-dark { display: none; }
@media (prefers-color-scheme: dark) { .diagram-light { display: none; } .diagram-dark { display: block; } }
.diagram-container > svg { display: block; width: 100%; height: auto; min-width: var(--w); }

/* 가로로 더 볼 내용이 있는 쪽 가장자리를 흐리게 한다(스크립트가 클래스를 붙인다). */
.fade-r { mask-image: linear-gradient(to right, #000 calc(100% - 2.5rem), transparent); }
.fade-l { mask-image: linear-gradient(to left, #000 calc(100% - 2.5rem), transparent); }
.fade-l.fade-r { mask-image: linear-gradient(to right, transparent, #000 2.5rem, #000 calc(100% - 2.5rem), transparent); }

/* 목차: 넓은 화면은 왼쪽에 고정된 목록(.toc), 좁은 화면은 오른쪽 아래 버튼(.toc-fab)과 바텀시트(.toc-sheet). */
.toc { display: none; }
.toc-title, .toc-sheet-head p { margin: 0; color: var(--muted); font-size: .8125rem; font-weight: 600; letter-spacing: .02em; }
.toc ol, .toc-sheet ol { margin: 0; padding: 0; list-style: none; }
.toc li, .toc-sheet li { margin: 0; }
.toc a, .toc-sheet a { display: block; color: var(--muted); line-height: 1.45; text-decoration: none; }
.toc a[aria-current], .toc-sheet a[aria-current] { color: var(--accent); font-weight: 600; }
.toc-fab {
  position: fixed;
  right: 1rem;
  bottom: calc(1rem + env(safe-area-inset-bottom));
  z-index: 1;
  display: flex;
  align-items: center;
  gap: .45rem;
  min-height: 2.75rem;
  padding: 0 1.1rem;
  color: var(--ink);
  font: 600 .875rem/1 var(--sans);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 999px;
  box-shadow: var(--lift);
  cursor: pointer;
  transition: transform 160ms ease-out;
  -webkit-tap-highlight-color: transparent;
}
.toc-fab:active { transform: scale(.97); }
.toc-fab svg, .toc-sheet-head svg { width: 1rem; height: 1rem; }
.toc-sheet {
  position: fixed;
  inset: auto 0 0;
  width: 100%;
  max-width: 36rem;
  max-height: min(75vh, 36rem);
  margin: 0 auto;
  padding: 0 0 env(safe-area-inset-bottom);
  color: var(--ink);
  background: var(--paper);
  border: 0;
  border-radius: 16px 16px 0 0;
  box-shadow: var(--lift);
}
.toc-sheet[open] { display: flex; flex-direction: column; transition: transform 280ms var(--ease-drawer); }
.toc-sheet::backdrop { background: rgb(0 0 0 / .35); transition: opacity 280ms ease-out; }
@starting-style {
  .toc-sheet[open] { transform: translateY(100%); }
  .toc-sheet[open]::backdrop { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .toc-sheet[open] { transition: none; } }
html:has(.toc-sheet[open]) { overflow: hidden; }
.toc-sheet-head { display: flex; align-items: center; justify-content: space-between; padding: .5rem .5rem .25rem 1.25rem; }
.toc-sheet-head button { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; color: var(--muted); background: none; border: 0; border-radius: 999px; cursor: pointer; }
.toc-sheet ol { position: relative; padding: .25rem .75rem 1rem; overflow-y: auto; overscroll-behavior: contain; }
.toc-sheet a { padding: .7rem .75rem; color: var(--ink); border-radius: 8px; }
.toc-sheet .sub a { padding-left: 1.75rem; color: var(--muted); }
.toc-sheet a[aria-current] { background: var(--paper-2); }
@media (min-width: 75rem) {
  .toc-fab { display: none; }
  .toc { display: block; position: fixed; top: 4.5rem; left: max(1.5rem, 50vw - 36rem); width: 12rem; max-height: calc(100vh - 9rem); overflow-y: auto; font-size: .875rem; }
  .toc-title { margin-bottom: .75rem; }
  .toc ol { border-left: 1px solid var(--rule); }
  .toc a { margin-left: -1px; padding: .3rem 0 .3rem .9rem; border-left: 2px solid transparent; }
  .toc .sub a { padding-left: 1.65rem; font-size: .95em; }
  .toc a:hover { color: var(--ink); }
  .toc a[aria-current] { border-left-color: var(--accent); }
  /* 왼쪽 목차와 겹치지 않게 넓은 그림·표는 오른쪽으로만 넓힌다. */
  .has-toc :is(.diagram, .table-wrap.wide) { margin-left: 0; margin-right: min(0px, 100% - min(var(--w), 100% + (100vw - 100%) / 2 - 1.5rem)); }
}

@media print {
  .toc, .toc-fab { display: none; }
  .diagram, .table-wrap.wide { margin-inline: 0; }
  .table-wrap, .diagram-container { overflow-x: visible; mask-image: none; }
  .diagram-container > svg { min-width: 0; }
}
</style>
<script>
addEventListener("DOMContentLoaded", () => {
  if (!document.title) document.title = document.querySelector("h1")?.textContent ?? "";

  for (const table of document.querySelectorAll("table")) {
    if (table.parentElement.classList.contains("table-wrap")) continue;
    const wrap = Object.assign(document.createElement("div"), { className: "table-wrap", tabIndex: 0 });
    wrap.setAttribute("role", "region");
    wrap.setAttribute("aria-label", "표");
    table.replaceWith(wrap);
    wrap.append(table);
    if (wrap.scrollWidth > wrap.clientWidth) wrap.classList.add("wide");
  }

  // 소제목이 3개 이상이면 목차를 만든다. 레이아웃이 바뀌므로 가장자리 표시보다 먼저 한다.
  const heads = [...document.querySelectorAll("h2, h3")];
  if (heads.length >= 3) buildToc(heads);

  const scrollers = [...document.querySelectorAll(".table-wrap, .diagram-container")];
  const fade = (el) => {
    el.classList.toggle("fade-l", el.scrollLeft > 4);
    el.classList.toggle("fade-r", el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
  };
  for (const el of scrollers) {
    fade(el);
    el.addEventListener("scroll", () => fade(el), { passive: true });
  }
  addEventListener("resize", () => scrollers.forEach(fade));
});

function buildToc(heads) {
  const list = document.createElement("ol");
  heads.forEach((head, i) => {
    head.id ||= `s${i + 1}`;
    const item = document.createElement("li");
    if (head.localName === "h3") item.className = "sub";
    item.append(Object.assign(document.createElement("a"), { href: `#${head.id}`, textContent: head.textContent }));
    list.append(item);
  });

  const nav = Object.assign(document.createElement("nav"), { className: "toc" });
  nav.setAttribute("aria-label", "목차");
  nav.append(Object.assign(document.createElement("p"), { className: "toc-title", textContent: "목차" }), list);

  const sheet = Object.assign(document.createElement("dialog"), { className: "toc-sheet" });
  sheet.setAttribute("aria-label", "목차");
  sheet.innerHTML = '<div class="toc-sheet-head"><p>목차</p><button type="button" aria-label="닫기">'
    + '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>';
  const sheetList = list.cloneNode(true);
  sheet.append(sheetList);

  const fab = Object.assign(document.createElement("button"), { className: "toc-fab", type: "button" });
  fab.setAttribute("aria-haspopup", "dialog");
  fab.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>목차</span>';

  document.body.prepend(nav);
  document.body.append(fab, sheet);
  document.documentElement.classList.add("has-toc");

  fab.addEventListener("click", () => {
    sheet.showModal();
    const current = sheetList.querySelector("[aria-current]");
    if (current) sheetList.scrollTop = current.offsetTop - sheetList.clientHeight / 2;
  });
  // 배경을 누르거나 항목·닫기 버튼을 누르면 닫는다. 항목 링크는 닫힌 뒤 그대로 이동한다.
  sheet.addEventListener("click", (event) => {
    if (event.target === sheet || event.target.closest("a, button")) sheet.close();
  });

  // 읽는 위치의 소제목을 목차에 표시한다. 화면 위 25% 안에 들어온 마지막 소제목, 끝까지 내리면 마지막 소제목.
  const links = [...nav.querySelectorAll("a"), ...sheetList.querySelectorAll("a")];
  let active = null;
  const spy = () => {
    let current = heads[0];
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) current = heads.at(-1);
    else for (const head of heads) {
      if (head.getBoundingClientRect().top > innerHeight * 0.25) break;
      current = head;
    }
    if (current === active) return;
    active = current;
    for (const link of links) {
      if (link.getAttribute("href") === `#${current.id}`) link.setAttribute("aria-current", "location");
      else link.removeAttribute("aria-current");
    }
  };
  let queued = false;
  addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; spy(); });
  }, { passive: true });
  spy();
}
</script>
</head>
<body>
